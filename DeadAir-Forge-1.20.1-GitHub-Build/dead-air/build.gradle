plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.deadair'
archivesBaseName = 'dead-air'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            mods { deadair { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.3.0' }

jar {
    manifest { attributes(['Specification-Title': 'deadair', 'Specification-Vendor': 'Dead Air', 'Specification-Version': '1', 'Implementation-Title': project.name, 'Implementation-Version': project.jar.archiveVersion, 'Implementation-Vendor': 'Dead Air']) }
}
