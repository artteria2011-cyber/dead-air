
name: Build Dead Air

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build mod
        working-directory: DeadAir-Forge-1.20.1-GitHub-Build/dead-air
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DeadAir-Forge-1.20.1
          path: DeadAir-Forge-1.20.1-GitHub-Build/dead-air/build/libs/*.jar
          if-no-files-found: error
